// Builds the wobbling blob's own path data (no clip-path() wrapper yet —
// callers combine it differently depending on whether content should be
// visible inside or outside the shape).
function blobPathData(radius, cx, cy, t) {
  const points = 28;
  const coords = [];
  for (let i = 0; i < points; i++) {
    const angle = (i / points) * Math.PI * 2;
    const wobble = 1
      + 0.07 * Math.sin(angle * 3 + t * 0.00276)
      + 0.05 * Math.sin(angle * 5 - t * 0.00207)
      + 0.03 * Math.sin(angle * 8 + t * 0.00414);
    const r = Math.max(0, radius * wobble);
    coords.push([cx + Math.cos(angle) * r, cy + Math.sin(angle) * r]);
  }
  // Smooth closed contour through midpoints (quadratic curves) rather
  // than a faceted polygon — no straight edges anywhere on the boundary.
  const mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  const first = mid(coords[coords.length - 1], coords[0]);
  let d = `M ${first[0].toFixed(1)} ${first[1].toFixed(1)} `;
  for (let i = 0; i < points; i++) {
    const next = coords[(i + 1) % points];
    const m = mid(coords[i], next);
    d += `Q ${coords[i][0].toFixed(1)} ${coords[i][1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)} `;
  }
  return `${d}Z`;
}

// clip-path coordinates are relative to the element's own border-box, not
// the viewport — so every target's blob has to be re-expressed in its own
// local space from the shared viewport-space center. Content shows only
// inside the blob; outside it, the element is clipped away entirely.
function clipShapeFor(el, radius, cx, cy, t) {
  const rect = el.getBoundingClientRect();
  const blob = blobPathData(radius, cx - rect.left, cy - rect.top, t);
  return `path('${blob}')`;
}

// The wordmark is a 3D plane now (see LOGO 3D setup), not a clippable DOM
// element, so it's handled separately — sinkVoid toggles its visibility
// by comparing the shrinking radius to its own (fixed) screen distance
// from center, the same threshold check sweepAtRadius already does for
// solids, and its reveal is a distinct custom fade in finishSweep (see
// there), same as before this conversion.
const VOID_TARGET_IDS = () => [
  document.getElementById('scene'),
  document.querySelector('.overlay'),
  document.getElementById('hint'),
];

// Both directions sink the same way: a blob spanning just past the
// viewport shrinks in toward the logo, and solids/text are only visible
// inside it — so each one goes invisible the instant the shrinking
// boundary sweeps past its position, outside-in, not all at once.
const logoWordmarkProjected = new THREE.Vector3();
function sinkVoid(direction) {
  return new Promise(resolve => {
    const targets = VOID_TARGET_IDS();
    const w = window.innerWidth, h = window.innerHeight;
    const cx = w / 2, cy = h / 2;
    // Fixed for the duration of this phase — the wordmark plane doesn't
    // move — so it's cheap to project once rather than every frame.
    logoWordmarkProjected.set(0, wordmarkCenterY, 0).project(camera);
    const wordmarkX = (logoWordmarkProjected.x * 0.5 + 0.5) * w;
    const wordmarkY = (-logoWordmarkProjected.y * 0.5 + 0.5) * h;
    const wordmarkDistance = Math.hypot(wordmarkX - cx, wordmarkY - cy);
    // "Just beyond the viewport" needs a little headroom beyond the
    // corner distance (hypot(w,h)/2) — orbits are bounded close to the
    // viewport edge (see randomOrbitShape), so a solid can sit near that
    // corner distance right as this phase starts, and too slim a margin
    // has the shrinking boundary land right on top of it instantly. But
    // the margin has to stay modest: it scales the SAME corner distance
    // regardless of aspect, and on a narrow/tall viewport that distance
    // is already inflated by the tall side while solids' actual reach is
    // capped by the (much smaller) width — so a big multiplier there burns
    // a large chunk of the fixed animation duration on an "invisible"
    // shrink no solid was ever near, compressing the real sweep into
    // what's left and making it read as an abrupt pop instead.
    const maxRadius = Math.hypot(w, h) / 2 * 1.03;
    const duration = 798;
    const start = performance.now();
    const fill = document.getElementById('fx-stroke-fill');

    document.body.style.background = BG_HEX.dark;

    function frame(now) {
      const elapsed = now - start;
      const t = Math.min(1, elapsed / duration);
      const eased = t * t * (3 - 2 * t);
      const radius = maxRadius * (1 - eased);
      targets.forEach(el => { el.style.clipPath = clipShapeFor(el, radius, cx, cy, elapsed); });
      logoWordmarkGroup.visible = radius >= wordmarkDistance;

      // toLight additionally paints the ALREADY-swallowed region (outside
      // the shrinking blob) solid black, with an evenodd hole punched out
      // at the blob itself — the mirror of the reveal phase's full-rect-
      // minus-blob fill. #fx-stroke-fill sits above #scene (z-index 4 vs
      // 0), so filling just the raw blob (solid INSIDE, no hole) here was
      // the bug: it painted over the still-visible, not-yet-clipped
      // solids the instant this phase started, regardless of how far the
      // boundary had actually shrunk. The evenodd cutout leaves that
      // still-visible region transparent, so #scene's own content —
      // already correctly gated by the matching clip-path above — shows
      // through until the boundary genuinely reaches it. toDark has no
      // decorative fill of its own here (the sun/paint-ring flourish
      // comes later, on the reveal).
      if (direction === 'toLight') {
        fill.setAttribute('d', `M0 0 H${w} V${h} H0 Z ${blobPathData(radius, cx, cy, elapsed)}`);
      }

      if (t < 1) { requestAnimationFrame(frame); return; }
      resolve(); // holds at this final (fully swallowed) frame until the reveal takes over
    }
    requestAnimationFrame(frame);
  });
}

function playSonar() {
  const layer = document.getElementById('fx-sonar');
  layer.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const ring = document.createElement('div');
    ring.className = 'sonar-ring';
    ring.style.borderColor = INK_HEX[pendingTheme];
    layer.appendChild(ring);
    ring.animate(
      [
        { transform: 'translate(-50%,-50%) scale(0)', opacity: 0.85 },
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 0 },
      ],
      { duration: 1450, delay: i * 203, easing: 'ease-out', fill: 'forwards' },
    );
  }
  setTimeout(() => { layer.innerHTML = ''; }, 1450 + 2 * 203 + 73);
}

// ── SHARED SWEEP MECHANICS ───────────────────────────────────────────
// Both directions recolor solids and text, and regrow the same blob to
// reveal them, the instant an expanding radius (in screen px from
// viewport center) reaches them — light's radius is also painted as a
// visible ring on top; dark's is paired with the sonar ping instead.
function buildSweepTargets() {
  const w = window.innerWidth, h = window.innerHeight;
  const cx = w / 2, cy = h / 2;
  const domTargets = [
    { el: document.querySelector('h1'), hexMap: INK_HEX },
    { el: document.querySelector('.sub'), hexMap: MUTED_HEX },
    { el: document.querySelector('.contact'), hexMap: TEAL_HEX },
    { el: document.getElementById('hint'), hexMap: HINT_HEX },
  ].map(t => {
    const r = t.el.getBoundingClientRect();
    const dx = r.left + r.width / 2 - cx, dy = r.top + r.height / 2 - cy;
    return { ...t, distance: Math.hypot(dx, dy), done: false };
  });
  const pieceTargets = pieces.map(p => ({ piece: p, done: false }));
  // The wordmark deliberately isn't here (and isn't in VOID_TARGET_IDS at
  // all) — it doesn't hard-clip-reveal alongside the scene/text like
  // everything else; it stays hidden through the whole reveal animation
  // and gets its own slow opacity fade-in afterward, in finishSweep.
  const clipTargets = VOID_TARGET_IDS();
  return { cx, cy, maxRadius: Math.hypot(w, h) / 2, domTargets, pieceTargets, clipTargets };
}

const sweepProjected = new THREE.Vector3();
function sweepAtRadius(state, radius, targetTheme) {
  state.pieceTargets.forEach(pt => {
    if (pt.done) return;
    sweepProjected.copy(pt.piece.mesh.position).project(camera);
    const sx = (sweepProjected.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-sweepProjected.y * 0.5 + 0.5) * window.innerHeight;
    if (radius >= Math.hypot(sx - state.cx, sy - state.cy)) {
      pt.done = true;
      const hex = colorFor(pt.piece.colorKey, targetTheme);
      pt.piece.fillMaterial.color.setHex(hex);
      pt.piece.edgeMaterial.color.setHex(hex);
      pt.piece.fillMaterial.opacity = targetTheme === 'light' ? 1 : pt.piece.dimFillOpacity;
    }
  });
  state.domTargets.forEach(dt => {
    if (!dt.done && radius >= dt.distance) {
      dt.done = true;
      dt.el.style.color = dt.hexMap[targetTheme];
    }
  });
  const now = performance.now();
  state.clipTargets.forEach(el => {
    el.style.clipPath = clipShapeFor(el, radius, state.cx, state.cy, now);
  });

  // Dark's reveal traces its growing boundary with a neon stroke — light's
  // doesn't (it already has the paint ring for that job). The black fill
  // covers the full viewport minus the blob itself (an evenodd hole), so
  // it reinforces the void everywhere the blob hasn't reached yet.
  if (targetTheme === 'dark') {
    const w = window.innerWidth, h = window.innerHeight;
    const blob = blobPathData(radius, state.cx, state.cy, now);
    document.getElementById('fx-stroke-fill').setAttribute('d', `M0 0 H${w} V${h} H0 Z ${blob}`);
    document.getElementById('fx-stroke-line').setAttribute('d', blob);
  }
}

// Builds enough giant-wordmark rows, stacked vertically, to cover the
// full viewport height — measuring one row's actual (already-stretched)
// rendered height first, rather than guessing a fixed count, so it holds
// up across different viewport sizes. Alternating rows drift in opposite
// directions ( -> <- -> ... ), tagged via a data attribute read later in
// finishSweep.
let giantWordmarkRows = null;
window.addEventListener('resize', () => { giantWordmarkRows = null; });

// Vertical spacing between rows is a fraction of each row's own rendered
// height — under 1 packs them tighter (some overlap) than their natural
// line height would. Horizontal stagger and drift are separate: stagger
// is each row's fixed resting offset (alternating left/right), already
// in place the instant it blips in; drift is how much further it travels
// in that SAME direction as it fades out.
const ROW_SPACING_FACTOR = 0.65;
const GIANT_WORDMARK_STAGGER_VW = 6; // extra zigzag on top of the overflow-clearing shift below
const GIANT_WORDMARK_DRIFT_VW = 20;

function buildGiantWordmarkRows() {
  const stack = document.getElementById('giant-wordmark-stack');
  stack.innerHTML = '';

  const probe = document.createElement('div');
  probe.className = 'giant-wordmark-row';
  probe.textContent = '404 NOT FOUND';
  probe.style.transform = 'translate(-50%,-50%) scaleY(2)';
  stack.appendChild(probe);
  const rowHeight = probe.getBoundingClientRect().height || 1;
  const rowWidth = probe.getBoundingClientRect().width || 1;
  stack.removeChild(probe);

  // At 18vw the row text is often wider than the viewport, so a
  // perfectly centered row only ever shows its middle slice, clipping
  // both ends identically every time. staggerVw is calibrated to how
  // much the text actually overflows (half the excess width, in vw)
  // plus a little extra zigzag — measured from whatever's actually in
  // the probe, so it stays correct regardless of the row text. Rows
  // shifted one direction clear enough to reveal the start of the text,
  // rows shifted the other way reveal the end instead — variety across
  // rows rather than every row cropping the same way.
  const overflowVw = Math.max(0, (rowWidth - window.innerWidth) / window.innerWidth * 50);
  const staggerVw = GIANT_WORDMARK_STAGGER_VW + overflowVw;

  const rowSpacing = rowHeight * ROW_SPACING_FACTOR;
  const rowCount = Math.ceil(window.innerHeight / rowSpacing) + 2;
  const centerIndex = Math.floor(rowCount / 2);
  const rows = [];
  for (let i = 0; i < rowCount; i++) {
    const row = document.createElement('div');
    row.className = 'giant-wordmark-row';
    row.textContent = '404 NOT FOUND';
    row.dataset.offsetY = (i - centerIndex) * rowSpacing;
    const sign = i % 2 === 0 ? 1 : -1; // -> <- -> ...
    row.dataset.driftSign = sign;
    row.dataset.offsetX = sign * staggerVw;
    stack.appendChild(row);
    rows.push(row);
  }
  return rows;
}

function getGiantWordmarkRows() {
  if (!giantWordmarkRows) giantWordmarkRows = buildGiantWordmarkRows();
  return giantWordmarkRows;
}

function finishSweep(state, targetTheme) {
  theme = targetTheme;
  renderer.setClearColor(THEME[targetTheme].clear);
  root.setAttribute('data-theme', targetTheme);
  state.domTargets.forEach(dt => { dt.el.style.color = ''; });
  state.clipTargets.forEach(el => { el.style.clipPath = ''; });
  document.body.style.background = '';

  // The fill is a no-op at full radius already (the hole matches the
  // whole viewport), so it can clear instantly — but the glowing line is
  // still a large, very visible ring at that point, so it dissolves
  // instead of snapping away.
  document.getElementById('fx-stroke-fill').setAttribute('d', '');
  const line = document.getElementById('fx-stroke-line');
  line.style.opacity = '0';
  setTimeout(() => {
    line.setAttribute('d', '');
    line.style.opacity = '';
  }, 580);

  // The wordmark plane was never part of the hard-clip reveal above —
  // it's stayed invisible (logoWordmarkGroup.visible = false, set back
  // in sinkVoid) this whole time. Show it now and fade in the correct
  // theme's mesh over the same duration the old DOM version used for its
  // blur+fade. Three.js has no cheap per-mesh blur (no custom render
  // pass here), so this simplifies to an opacity-only "materialize,"
  // dropping the blur nuance the CSS version had.
  logoWordmarkGroup.visible = true;
  const wordmarkShowMesh = targetTheme === 'dark' ? wordmarkMeshReversed : wordmarkMeshPrimary;
  const wordmarkHideMesh = targetTheme === 'dark' ? wordmarkMeshPrimary : wordmarkMeshReversed;
  wordmarkHideMesh.material.opacity = 0;
  wordmarkShowMesh.material.opacity = 0;
  tween(1600, t => t, e => { wordmarkShowMesh.material.opacity = e; });

  // A stack of large echoes of the same text blips into view at 90%
  // opacity, row by row filling the screen — instantly, not eased —
  // then all slowly fade out while drifting, alternating rows opposite
  // directions. Same forced-reflow trick, but in reverse: disable the
  // transition for the instant "blip" in (at each row's resting
  // position), then re-enable it only for the slow fade-out + drift.
  // One reflow read covers the whole batch, not one per row.
  //
  // Going dark specifically, --ink is already the DARK theme's bright,
  // near-white value by the time this runs (the flip happens back in
  // phase 2) — that instant, 90%-opacity, 18vw blip in that color against
  // an already-dark background reads as a flashbang. Overriding to a
  // darker grey just for that direction avoids it; light keeps the
  // normal --ink (dark text on the light background it's revealing onto,
  // no flash risk there).
  const rows = getGiantWordmarkRows();
  rows.forEach(row => {
    row.style.transition = 'none';
    row.style.opacity = '0.9';
    row.style.color = targetTheme === 'dark' ? '#3a3226' : '';
    row.style.transform = `translate(calc(-50% + ${row.dataset.offsetX}vw), calc(-50% + ${row.dataset.offsetY}px)) scaleY(2)`;
  });
  rows[0].offsetHeight; // eslint-disable-line no-unused-expressions
  rows.forEach(row => {
    const sign = row.dataset.driftSign;
    row.style.transition = '';
    row.style.opacity = '0';
    row.style.transform = `translate(calc(-50% + ${Number(row.dataset.offsetX) + sign * GIANT_WORDMARK_DRIFT_VW}vw), calc(-50% + ${row.dataset.offsetY}px)) scaleY(2)`;
  });
}

// Dark: no visible mask ring of its own — the sonar ping is the visual,
// this just mirrors its timing to drive the actual recolor + reveal.
// Resolves with the sweep state; finishSweep (the real theme flip) is
// left to the caller, so it can be gated separately.
function sweepFromSonar(targetTheme) {
  return new Promise(resolve => {
    const state = buildSweepTargets();
    const duration = 1450;
    const start = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      sweepAtRadius(state, eased * state.maxRadius, targetTheme);
      if (t < 1) { requestAnimationFrame(frame); return; }
      resolve(state);
    }
    requestAnimationFrame(frame);
  });
}

// Light: a second, distinct blob — solid white, always a little ahead of
// the element-reveal boundary — paints the background itself (behind the
// canvas) while the element-reveal blob separately un-hides each solid
// and text element. The real background/theme flip happens right at the
// start here too (mirroring how dark already flips early), so the paint
// blob and the canvas are showing the correct color from frame one — by
// the time Phase 4 runs, there's nothing left for it to change.
const RING_THICKNESS = 110;
const PAINT_LEAD = 150;

function playRipple(targetTheme) {
  return new Promise(resolve => {
    // Release the sink phase's held decorative fill (toLight leaves it
    // covering everything) — this phase reveals through its own paint
    // blob and content clip-paths instead.
    document.getElementById('fx-stroke-fill').setAttribute('d', '');

    theme = targetTheme;
    renderer.setClearColor(THEME[targetTheme].clear);
    root.setAttribute('data-theme', targetTheme);

    const paint = document.getElementById('fx-paint');
    paint.style.background = BG_HEX[targetTheme];
    const revealLine = document.getElementById('fx-reveal-line');

    const state = buildSweepTargets();
    const duration = 1305;
    const start = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      const outer = eased * (state.maxRadius + RING_THICKNESS);

      const paintRadius = outer + PAINT_LEAD;
      paint.style.clipPath = `path('${blobPathData(paintRadius, state.cx, state.cy, now)}')`;
      // A thick, flatly solid outline traces the actual element-reveal
      // boundary (not the paint blob's leading edge) — the opposite of
      // dark's thinner, glowing line.
      revealLine.setAttribute('d', blobPathData(outer, state.cx, state.cy, now));

      sweepAtRadius(state, outer, targetTheme);

      if (t < 1) {
        requestAnimationFrame(frame);
        return;
      }

      paint.style.clipPath = '';
      paint.style.background = '';
      revealLine.style.opacity = '0';
      setTimeout(() => {
        revealLine.setAttribute('d', '');
        revealLine.style.opacity = '';
      }, 580);
      resolve(state);
    }
    requestAnimationFrame(frame);
  });
}

document.querySelector('.logo-center').addEventListener('click', () => { window.location.href = '/'; });

// ── DRAG / CLICK INTERACTION (pointer events: mouse + touch) ────────
// A drag carries a piece off its ring; on release it re-locks onto that
// same ring at the angle where you let go. A tap/click on the sun piece
// — one that ends near where it started — starts the day/night transition.
let selected = null;
let isDragging = false;
const previousPointer = new THREE.Vector2();
const downScreen = new THREE.Vector2();
const lastScreen = new THREE.Vector2();
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const intersection = new THREE.Vector3();
const offset = new THREE.Vector3();

function setPointerFromEvent(e) {
  pointerNDC.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(e.clientY / window.innerHeight) * 2 + 1;
  lastScreen.set(e.clientX, e.clientY);
}

function pickPiece() {
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObjects(pieceMeshes, false);
  return hits.length ? pieceMeshes.indexOf(hits[0].object) : null;
}

function onPointerDown(e) {
  setPointerFromEvent(e);
  previousPointer.copy(pointerNDC);
  downScreen.copy(lastScreen);
  const idx = pickPiece();
  if (idx === null) return;

  selected = idx;
  isDragging = true;
  document.body.style.cursor = 'grabbing';
  setHoveredPiece(idx); // make sure its path is showing (and colored) before the drag starts warping it

  raycaster.setFromCamera(pointerNDC, camera);
  raycaster.ray.intersectPlane(dragPlane, intersection);
  offset.copy(intersection).sub(pieces[idx].mesh.position);
}

function onPointerMove(e) {
  setPointerFromEvent(e);

  if (isDragging && selected !== null) {
    const piece = pieces[selected];
    raycaster.setFromCamera(pointerNDC, camera);
    raycaster.ray.intersectPlane(dragPlane, intersection);
    if (!intersection) return;

    piece.mesh.position.copy(intersection.clone().sub(offset));

    const dx = pointerNDC.x - previousPointer.x;
    const dy = pointerNDC.y - previousPointer.y;
    const rotSpeed = 3;
    piece.mesh.rotation.y += dx * rotSpeed;
    piece.mesh.rotation.x += dy * rotSpeed;

    // The ellipse only reorients once the drag pushes the piece beyond
    // its current major vertex; within that, the piece just rides the
    // existing path. See updateOrbitForDrag for the full rule.
    updateOrbitForDrag(piece.orbit, piece.mesh.position);
    setOrbitPathGeometry(piece.orbit);

    previousPointer.copy(pointerNDC);
    return;
  }

  const idx = pickPiece();
  document.body.style.cursor = idx === null ? 'default' : (pieces[idx].isToggle ? 'pointer' : 'grab');
  setHoveredPiece(idx);
}

function onPointerUp() {
  if (isDragging && selected !== null) {
    const piece = pieces[selected];

    if (piece.isToggle && downScreen.distanceTo(lastScreen) < 6) {
      beginThemeTransition();
    }

    // phase/majorAxis/minorAxis are already current — updateOrbitForDrag
    // keeps them in sync every drag frame — so just make sure the
    // displayed path matches the final orbit shape.
    setOrbitPathGeometry(piece.orbit);
  }
  isDragging = false;
  selected = null;
  document.body.style.cursor = 'default';
}

window.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Grain drifts opposite the cursor — a cheap parallax shift rather than
// regenerating the turbulence itself, which would be expensive per frame.
const grain = document.getElementById('grain');
window.addEventListener('pointermove', (e) => {
  const nx = e.clientX / window.innerWidth - 0.5;
  const ny = e.clientY / window.innerHeight - 0.5;
  grain.style.transform = `translate(${nx * -24}px, ${ny * -24}px)`;
});

// ── SCROLL REACTIVITY ─────────────────────────────────────────────────
// The page itself never scrolls (html/body are overflow:hidden) — wheel
// input is purely a signal here, driving the kicker marquee and the
// solids' orbit speed/direction. Direction and magnitude are tracked
// separately: direction is just whichever way the most recent wheel
// event moved, taking effect immediately. Magnitude is a multiplier
// that starts at 1 (normal speed), gets multiplied by 1.5 on every wheel
// event regardless of direction (capped at 10, i.e. 1000%), and decays
// back toward 1 on its own between events — so reversing direction
// doesn't reset the boost already built up, it only takes another scroll
// to change it.
let scrollDirection = 1;
let velocityMultiplier = 1;
const VELOCITY_BOOST = 1.5;
const VELOCITY_MAX = 10;
const VELOCITY_DECAY_TAU = 1.5; // seconds — roughly how long "slowly" takes

// The h1's subject word stays "404" always on this page — instead, one
// step per wheel event (in scroll direction) cycles which TYPEFACE it's
// set in, same discrete per-event granularity as the velocity boost
// above, not a per-frame animation.
const HERO_STYLES = [
  { fontFamily: 'var(--font-heading)' }, // default — Archivo Black
  { fontFamily: "'Dancing Script', cursive" },
  { fontFamily: 'var(--font-mono)' }, // Space Mono
  { fontFamily: "'Playfair Display', serif" },
  { fontFamily: "'UnifrakturCook', cursive" }, // blackletter, just for the flourish
];
let heroWordIndex = 0;
const heroWordEl = document.getElementById('hero-word');

// While scroll input keeps arriving, "404" glitches — the base text's
// own font-family flickers between random styles AND two duplicate
// layers (see #hero-word::before/::after) each clip to an independently-
// randomized horizontal band and shift sideways, read as sectors of the
// glyphs tearing out of sync with their neighbors, same idea as screen
// tearing — rather than snapping straight to the next target style. Once
// input stops for GLITCH_SETTLE_MS, the bands clear and the font settles
// on the real target (heroWordIndex, still advanced on every tick same
// as before — the glitch is purely visual noise on top, it doesn't touch
// the underlying index). glitchTimer restarts settleTimer on every tick
// so settling only ever fires after a genuine pause.
const GLITCH_FRAME_MS = 65;
const GLITCH_SETTLE_MS = 180;
let glitchTimer = null;
let settleTimer = null;

function randomizeGlitchBand(n) {
  const top = Math.random() * 65; // % from the top the band starts
  const height = 12 + Math.random() * 30; // % tall
  const sign = Math.random() < 0.5 ? -1 : 1;
  const offsetPx = sign * (10 + Math.random() * 22); // sideways tear distance — never near-zero, always a clear displacement
  const visible = Math.random() < 0.85; // mostly on, brief dropouts rather than mostly off
  heroWordEl.style.setProperty(`--glitch${n}-clip`, `inset(${top}% 0 ${100 - top - height}% 0)`);
  heroWordEl.style.setProperty(`--glitch${n}-x`, `${offsetPx}px`);
  heroWordEl.style.setProperty(`--glitch${n}-opacity`, visible ? '1' : '0');
}

function settleHeroStyle() {
  clearInterval(glitchTimer);
  glitchTimer = null;
  heroWordEl.style.setProperty('--glitch1-opacity', '0');
  heroWordEl.style.setProperty('--glitch2-opacity', '0');
  heroWordEl.style.fontFamily = HERO_STYLES[heroWordIndex].fontFamily;
}

// Shared by both the wheel listener and the touch-swipe listener below —
// one "tick" of scroll signal, direction-aware, regardless of input type.
function handleScrollTick(direction) {
  scrollDirection = direction;
  velocityMultiplier = Math.min(VELOCITY_MAX, velocityMultiplier * VELOCITY_BOOST);
  heroWordIndex = (heroWordIndex + direction + HERO_STYLES.length) % HERO_STYLES.length;

  if (!glitchTimer) {
    glitchTimer = setInterval(() => {
      const flicker = HERO_STYLES[Math.floor(Math.random() * HERO_STYLES.length)];
      heroWordEl.style.fontFamily = flicker.fontFamily;
      randomizeGlitchBand(1);
      randomizeGlitchBand(2);
    }, GLITCH_FRAME_MS);
  }
  clearTimeout(settleTimer);
  settleTimer = setTimeout(settleHeroStyle, GLITCH_SETTLE_MS);
}

window.addEventListener('wheel', (e) => {
  handleScrollTick(e.deltaY < 0 ? -1 : 1);
}, { passive: true });

// Swipe gestures read the same way on mobile — the page still never
// actually scrolls (html/body stay overflow:hidden), this just derives
// the same direction/tick signal from finger movement instead of a wheel
// delta. touchLastY resets per-touch (not per-move), so a single swipe
// can fire multiple ticks if it covers enough distance, same as a fast
// flick of a real scroll wheel firing several wheel events in a row.
let touchLastY = null;
const TOUCH_TICK_PX = 12; // minimum finger movement per tick — keeps a slow drag from firing constantly
window.addEventListener('touchstart', (e) => {
  touchLastY = e.touches[0].clientY;
}, { passive: true });
window.addEventListener('touchmove', (e) => {
  if (touchLastY === null || isDragging) return; // a piece-drag owns this touch instead
  const y = e.touches[0].clientY;
  const delta = touchLastY - y; // swiping up reads as scrolling forward, matching a positive wheel deltaY
  if (Math.abs(delta) < TOUCH_TICK_PX) return;
  handleScrollTick(delta < 0 ? -1 : 1);
  touchLastY = y;
}, { passive: true });
window.addEventListener('touchend', () => { touchLastY = null; }, { passive: true });

// ── KICKER MARQUEE ────────────────────────────────────────────────────
// Alternates between the two kicker items. The repeat unit for the
// seamless-loop math is one full CYCLE through both items (not just one
// item) — measured once via a hidden probe — since that's the actual
// repeating period once they alternate; wrapping on a single item's
// width would desync the offset from the pattern mid-cycle.
const KICKER_ITEMS = ['404', 'PAGE NOT FOUND...YET'];
const KICKER_SEP = '  •  ';
const KICKER_REPEATS = 16;
const kickerTrack = document.getElementById('kicker-track');
kickerTrack.textContent = Array.from(
  { length: KICKER_REPEATS * KICKER_ITEMS.length },
  (_, i) => KICKER_ITEMS[i % KICKER_ITEMS.length],
).join(KICKER_SEP) + KICKER_SEP;

const kickerProbe = document.createElement('span');
kickerProbe.className = 'kicker-track';
kickerProbe.style.cssText = 'position:fixed; visibility:hidden; white-space:nowrap;';
kickerProbe.textContent = KICKER_ITEMS.join(KICKER_SEP) + KICKER_SEP;
document.body.appendChild(kickerProbe);
const kickerUnitWidth = kickerProbe.getBoundingClientRect().width || 100;
document.body.removeChild(kickerProbe);

let kickerOffset = 0;
const MARQUEE_BASE_SPEED = 22; // px/sec, idle drift

// ── OVERLAY TEXT WIDTH ───────────────────────────────────────────────
// h1's max-width has to fit its WIDEST rendered line, or a line that
// can't wrap (single word, no spaces) just overflows the box visually
// while flexbox still allocates space based on the narrower declared
// max-width — colliding with .hero-copy right next to it. That widest
// line isn't always "404": "TAKING"/"SHAPE" are fixed (never cycle
// style) but can render wider than "404" does in any of its styles, so
// they're measured too, in h1's default font. Measured live via a hidden
// probe styled with h1's own computed font, since h1's font-size is a
// responsive clamp(), not a fixed value a ch unit could track
// consistently across viewport sizes.
function updateOverlayTextMaxWidth() {
  const probe = document.createElement('span');
  probe.style.cssText = 'position:fixed; visibility:hidden; white-space:nowrap;';
  probe.style.font = getComputedStyle(document.querySelector('h1')).font;
  document.body.appendChild(probe);
  probe.textContent = '404';
  let width = HERO_STYLES.reduce((max, style) => {
    probe.style.fontFamily = style.fontFamily;
    return Math.max(max, probe.getBoundingClientRect().width);
  }, 0);
  probe.style.fontFamily = ''; // back to h1's default for the fixed lines
  ['TAKING', 'SHAPE'].forEach(word => {
    probe.textContent = word;
    width = Math.max(width, probe.getBoundingClientRect().width);
  });
  document.body.removeChild(probe);
  root.style.setProperty('--overlay-text-max-width', `${width}px`);
}
updateOverlayTextMaxWidth();
window.addEventListener('resize', updateOverlayTextMaxWidth);

// Both of the above run synchronously very early — before the page's
// Google Fonts have actually swapped in (document.fonts.status is still
// "loading" at that point, confirmed by testing). Measuring against
// fallback-font metrics under-shoots real ones enough that .hero-row's
// true height/position and h1's true widest line were both wrong,
// re-opening the exact overlaps these two functions exist to prevent.
// Re-running both once the real fonts are actually in gets it right.
document.fonts.ready.then(() => {
  updateOverlayTextMaxWidth();
  updateLogoClearance();
});

// ── ANIMATION LOOP ───────────────────────────────────────────────────
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // Decay the magnitude boost back toward 1, continuously (frame-rate
  // independent) rather than a flat per-frame multiply.
  velocityMultiplier = 1 + (velocityMultiplier - 1) * Math.exp(-dt / VELOCITY_DECAY_TAU);

  pieces.forEach((piece, i) => {
    piece.mesh.rotation.y += piece.orbit.spin * dt;
    piece.mesh.rotation.x += piece.orbit.spin * 0.6 * dt;

    if (i === selected) return;

    piece.orbit.phase += piece.orbit.speed * scrollDirection * velocityMultiplier * dt;
    piece.mesh.position.copy(orbitPosition(piece.orbit));
  });

  const marqueeSpeed = MARQUEE_BASE_SPEED * scrollDirection * velocityMultiplier;
  kickerOffset = ((kickerOffset - marqueeSpeed * dt) % kickerUnitWidth + kickerUnitWidth) % kickerUnitWidth;
  kickerTrack.style.transform = `translateX(${-kickerOffset}px)`;

  if (hoveredPieceIndex !== null && orbitPathTotalLength > 0) {
    const hovered = pieces[hoveredPieceIndex];
    const dashSpeed = hovered.orbit.speed * scrollDirection * velocityMultiplier * hovered.orbit.majorAxis.length();
    dashProgress = ((dashProgress - dashSpeed * dt) % orbitPathTotalLength + orbitPathTotalLength) % orbitPathTotalLength;
    const distAttr = orbitPathLine.geometry.attributes.lineDistance;
    for (let i = 0; i < distAttr.array.length; i++) {
      distAttr.array[i] = orbitPathBaseDistances[i] + dashProgress;
    }
    distAttr.needsUpdate = true;
  }

  // Logo icon hover dip — suspended while sink/rise (logoIconBusy) owns
  // logoIconGroup's position instead.
  if (!logoIconBusy) {
    const dipTarget = logoHovered ? iconCenterY + logoShiftWorld - LOGO_HOVER_DIP : iconCenterY + logoShiftWorld;
    logoIconGroup.position.y += (dipTarget - logoIconGroup.position.y) * Math.min(1, dt / 0.09);
  }

  renderer.render(scene, camera);
}
animate();

// ── PAGE-LOAD CEREMONY ───────────────────────────────────────────────
// Once, on first load: the giant-wordmark blip-in-then-fade (normally a
// theme-toggle flourish, see finishSweep) plays at a slower pace, while
// the rest of the page — scene, overlay text, logo — resolves out of
// the blurred/invisible state defined in CSS (:root:not([data-loaded])).
// Both are driven by the same data-loaded flip so they read as one
// ceremony rather than two unrelated animations.
const LOAD_ROW_FADE_MS = 4200; // slower than the 2.5s used on theme toggles
const LOGO_REVEAL_MS = 2100; // matches the CSS #scene/.overlay/.logo-center transition
function playLoadCeremony() {
  if (prefersReducedMotion) {
    root.setAttribute('data-loaded', 'true');
    return;
  }

  // The 3D logo isn't part of the DOM blur-reveal (no cheap per-mesh
  // blur in Three.js) — just fade its currently-active meshes in from 0
  // over the same duration, so it resolves into view alongside
  // everything else instead of popping in sharp immediately.
  const activeIconMesh = theme === 'dark' ? iconMeshReversed : iconMeshPrimary;
  const activeWordmarkMesh = theme === 'dark' ? wordmarkMeshReversed : wordmarkMeshPrimary;
  const iconTargetOpacity = activeIconMesh.material.opacity;
  const wordmarkTargetOpacity = activeWordmarkMesh.material.opacity;
  activeIconMesh.material.opacity = 0;
  activeWordmarkMesh.material.opacity = 0;
  tween(LOGO_REVEAL_MS, t => t, e => {
    activeIconMesh.material.opacity = e * iconTargetOpacity;
    activeWordmarkMesh.material.opacity = e * wordmarkTargetOpacity;
  });

  root.setAttribute('data-loaded', 'true');

  // Blip in instantly (no fade-in — same instant-appearance rule the
  // theme-toggle version follows), forced reflow, then re-enable
  // transition at the slower duration for the fade-out + drift.
  const rows = getGiantWordmarkRows();
  rows.forEach(row => {
    row.style.transition = 'none';
    row.style.opacity = '0.9';
    row.style.transform = `translate(calc(-50% + ${row.dataset.offsetX}vw), calc(-50% + ${row.dataset.offsetY}px)) scaleY(2)`;
  });
  rows[0].offsetHeight; // eslint-disable-line no-unused-expressions
  rows.forEach(row => {
    const sign = row.dataset.driftSign;
    row.style.transition = `opacity ${LOAD_ROW_FADE_MS}ms ease, transform ${LOAD_ROW_FADE_MS}ms ease`;
    row.style.opacity = '0';
    row.style.transform = `translate(calc(-50% + ${Number(row.dataset.offsetX) + sign * GIANT_WORDMARK_DRIFT_VW}vw), calc(-50% + ${row.dataset.offsetY}px)) scaleY(2)`;
  });
  // Hand the rows back to their normal (faster) CSS-defined transition
  // once this slower one has finished, so a later theme toggle reusing
  // the same memoized rows isn't stuck at ceremony speed.
  setTimeout(() => {
    rows.forEach(row => { row.style.transition = ''; });
  }, LOAD_ROW_FADE_MS);
}
playLoadCeremony();
</script>
</body>
</html>
